version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '01:00'
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: '@solana/web3.js'
      - dependency-name: '@solana-program/stake'
      - dependency-name: '@types/node'
        versions: ['>=21']
      - dependency-name: typescript
        versions: ['>=6']
      - dependency-name: '@noble/*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      solana:
        patterns:
          - '@solana/*'
          - '@solana-program/*'
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/workflows/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
