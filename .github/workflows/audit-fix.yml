name: Audit Fix

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit-fix
  cancel-in-progress: false

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Override vulnerable packages
        run: |
          pnpm audit --fix || true
          pnpm install --lockfile-only

      - name: Verify audit passes
        run: pnpm audit

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: fix/audit-advisories
          delete-branch: true
          sign-commits: true
          commit-message: 'fix(deps): resolve pnpm audit advisories'
          title: 'fix(deps): resolve pnpm audit advisories'
          body: |
            Automated by the `Audit Fix` workflow: `pnpm audit --fix` adds overrides for vulnerable packages, then `pnpm audit` re-runs clean.

            Approve the pending workflow runs to start CI, and review forced overrides for major-version jumps before merging.
