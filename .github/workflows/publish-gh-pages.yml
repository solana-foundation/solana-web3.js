name: Publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  compile-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/workflows/actions/install-dependencies

      - name: Compile and Upload Artifacts
        uses: ./.github/workflows/actions/compile-gh-pages

  publish:
    runs-on: ubuntu-latest
    needs: [compile-gh-pages]
    permissions:
      contents: write
    steps:
      - name: Download Deploy Directory from Artifact Cache
        uses: actions/download-artifact@v4
        with:
          path: .ghpages-deploy
          pattern: ghpages-deploy-artifacts*
          merge-multiple: true

      - name: Checkout Currently Published Site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .ghpages-current

      - name: Preserve Maintenance Branch Docs
        run: |
          for versioned in .ghpages-current/v[0-9]*.x; do
            name=$(basename "$versioned")
            if [ ! -d ".ghpages-deploy/$name" ]; then
              cp -r "$versioned" ".ghpages-deploy/$name"
            fi
          done

      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .ghpages-deploy
