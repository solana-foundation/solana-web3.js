name: Publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  compile-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies
        uses: ./.github/workflows/actions/install-dependencies

      - name: Compile and Upload Artifacts
        uses: ./.github/workflows/actions/compile-gh-pages

  publish:
    runs-on: ubuntu-latest
    needs: [compile-gh-pages]
    permissions:
      contents: write
    steps:
      - name: Download Deploy Directory from Artifact Cache
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .ghpages-deploy
          pattern: ghpages-deploy-artifacts*
          merge-multiple: true

      - name: Checkout Currently Published Site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: .ghpages-current

      - name: Preserve Maintenance Branch Docs
        run: |
          for versioned in .ghpages-current/v[0-9]*.x; do
            name=$(basename "$versioned")
            if [ ! -d ".ghpages-deploy/$name" ]; then
              cp -r "$versioned" ".ghpages-deploy/$name"
            fi
          done

      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .ghpages-deploy
